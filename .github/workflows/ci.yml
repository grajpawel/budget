name: CI

on:
  push:
    branches: [main, develop, fix-actions]
  pull_request:
    branches: [main, develop]

env:
  DOTNET_VERSION: '8.0.x'
  NODE_VERSION: '20.x'

jobs:
  # =============================================================================
  # Frontend Checks
  # =============================================================================
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: src/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: src/web/dist
          retention-days: 7

  # =============================================================================
  # Backend Checks
  # =============================================================================
  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # TODO: Uncomment when tests are added
      # - name: Run tests
      #   run: dotnet test --no-build --configuration Release --verbosity normal --collect:"XPlat Code Coverage"

      - name: Publish Lambda
        run: dotnet publish -c Release -r linux-x64 --self-contained true -o ./publish

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-lambda
          path: src/api/publish
          retention-days: 7

  # =============================================================================
  # Infrastructure Validation
  # =============================================================================
  infrastructure:
    name: CDK Synth
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: |
          echo "=== TypeScript version ==="
          npx tsc --version
          echo "=== Current directory ==="
          pwd
          echo "=== Directory structure before build ==="
          ls -la
          echo "=== Source files ==="
          find bin lib -name "*.ts" 2>/dev/null || echo "No source files found"
          echo "=== tsconfig.json content ==="
          cat tsconfig.json
          echo "=== Running tsc with verbose output ==="
          npx tsc --listEmittedFiles 2>&1 || true
          echo "=== Directory structure after build ==="
          ls -la
          echo "=== Checking dist directory ==="
          ls -laR dist/ 2>/dev/null || echo "dist/ directory not found"

      - name: CDK Synth
        run: npx cdk synth --quiet
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: 'eu-central-1'
